version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: daily
      open-pull-requests-limit: 10
      versioning-strategy: increase
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: daily
      groups:
          codeql:
              patterns:
                  - 'github/codeql-action*'
    - package-ecosystem: gitsubmodule
      directory: '/'
      schedule:
          interval: daily
